name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm install
      - name: Generate Android project
        working-directory: mobile-app
        run: npx expo prebuild --platform android --no-install
      # Release (not debug): a debug APK does NOT contain the JS bundle and shows
      # "Unable to load script" when opened without a Metro dev server.
      # Expo's template signs release builds with the debug key, so it installs fine.
      - name: Build APK (JS bundle embedded)
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anything-but-a-game-controller-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
